apiVersion: apps/v1
kind: Deployment
metadata:
  name: devflow
  namespace: devflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devflow
  template:
    metadata:
      labels:
        app: devflow
    spec:
      containers:
        - name: devflow
          image: technura/devflow:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: devflow-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5